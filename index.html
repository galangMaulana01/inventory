    function renderSalesSheet(view="sell"){const product=groupedProducts("sale").find(item=>item.product_id===state.saleProductId);if(view==="cart"||!product){renderCartSheet();return;}const colors=groupedColors(product),activeColor=colors.find(c=>c.color_id===state.saleColorId)||colors[0];if(!state.saleColorId&&activeColor)state.saleColorId=activeColor.color_id;const variants=activeColor?activeColor.variants.filter(v=>v.sale_qty>0):[],variant=variants.find(item=>item.id===state.saleVariantId);$("salesSheetContent").innerHTML=`<div class="flex items-start justify-between gap-3"><div><h2 class="text-3xl font-medium">${escapeHtml(product.product_name)}</h2><p class="mt-1 text-sm text-gray-500">${escapeHtml(product.model)}</p></div><div class="flex gap-2"><button data-open-cart class="${style.button} ${style.primary} px-3 py-2">Keranjang ${state.cart.length}</button><button data-close="salesSheet" class="${style.iconButton}">×</button></div></div><div class="mt-6"><p class="text-sm font-medium">Pilih warna</p><div class="mt-3 flex flex-wrap gap-2">${colors.map(color=>`<button data-sale-color="${color.color_id}" class="flex items-center gap-2 rounded-lg border px-3 py-2 text-sm font-medium ${color.color_id===state.saleColorId?"border-blue-600 bg-blue-600 text-white":"border-gray-200 bg-white text-gray-900"}">${colorDot(color.color,"size-6",color.color_hex,color.color_stops,color.color_type)} ${escapeHtml(color.color)}</button>`).join("")}</div></div><div class="mt-6"><p class="text-sm font-medium">Pilih size</p><div class="mt-3 flex flex-wrap gap-2">${variants.map(item=>`<button data-sale-variant="${item.id}" class="rounded-lg border px-4 py-2 text-sm font-medium ${item.id===state.saleVariantId?"border-blue-600 bg-blue-600 text-white":"border-gray-200 bg-white text-gray-900"}">${escapeHtml(item.size)} <span class="ml-1 text-xs opacity-70">${item.sale_qty}</span></button>`).join("")}</div></div>${variant?`<div class="mt-6 rounded-lg bg-gray-50 p-4"><p class="font-medium">${escapeHtml(variant.color)} · Size ${escapeHtml(variant.size)}</p><p class="mt-1 text-sm text-gray-500">Stok ${variant.sale_qty} · Harga ${rupiah(variant.minimum_price)} — ${rupiah(variant.normal_price)}</p><div class="mt-4 grid gap-3 sm:grid-cols-2"><label class="${style.label}">Jumlah<input id="saleQty" type="number" min="1" max="${variant.sale_qty}" value="1" class="${style.input}"/></label><label class="${style.label}">Harga jual<input id="salePrice" type="number" min="${variant.minimum_price}" max="${variant.normal_price}" value="${variant.normal_price}" class="${style.input}"/></label></div><button data-add-cart class="mt-4 w-full ${style.button} ${style.primary}">+ Masukkan keranjang</button></div>`:`<p class="mt-6 rounded-lg bg-gray-50 p-4 text-sm text-gray-500">Pilih size untuk melanjutkan.</p>`}`;}
    function renderCartSheet(){$("salesSheetContent").innerHTML=`<div class="flex items-start justify-between gap-3"><h2 class="text-3xl font-medium">Pesanan saat ini</h2><button data-close="salesSheet" class="${style.iconButton}">×</button></div>${state.cart.length?`<div class="mt-6 space-y-3">${state.cart.map(item=>`<article class="flex items-center gap-3 rounded-lg bg-gray-50 p-3">${productPhoto(item,"size-14 shrink-0 rounded-lg")}<div class="min-w-0 flex-1"><p class="truncate font-medium">${escapeHtml(item.product_name)}</p><p class="mt-1 text-xs text-gray-500">${escapeHtml(item.color)} · ${escapeHtml(item.size)} · ${item.qty} unit</p><p class="mt-1 text-sm font-medium">${rupiah(item.qty*item.unit_price)}</p></div><button data-remove-cart="${item.variant_id}" class="rounded-lg bg-white px-3 py-2 text-xs font-medium text-red-500 ring-1 ring-gray-200">Hapus</button></article>`).join("")}</div><div class="mt-6"><p class="text-sm font-medium">Metode pembayaran</p><div class="mt-3 grid grid-cols-3 gap-2"><button type="button" data-payment-method="cash" class="${style.button} border ${state.paymentMethod==="cash"?"border-blue-600 bg-blue-600 text-white":"border-gray-200 bg-white text-gray-900"}">Cash</button><button type="button" data-payment-method="bank" class="${style.button} border ${state.paymentMethod==="bank"?"border-blue-600 bg-blue-600 text-white":"border-gray-200 bg-white text-gray-900"}">Bank</button><button type="button" data-payment-method="wallet" class="${style.button} border ${state.paymentMethod==="wallet"?"border-blue-600 bg-blue-600 text-white":"border-gray-200 bg-white text-gray-900"}">Wallet</button></div></div><div class="mt-5 rounded-lg border border-gray-200 bg-white p-4"><label class="flex cursor-pointer items-center justify-between gap-3"><span class="flex items-center gap-2 text-sm font-medium"><input id="cartDiscountToggle" type="checkbox" ${state.cartDiscountEnabled?"checked":""} class="size-4 accent-blue-600"/>Diskon</span><span class="text-xs text-gray-400">Nominal</span></label>${state.cartDiscountEnabled?`<input id="cartDiscountInput" type="number" min="0" max="${cartMaxDiscount()}" step="1" value="${state.cartDiscount||""}" placeholder="Contoh: 20000" class="${style.input} mt-3"/>`:""}<p id="cartDiscountHint" class="mt-2 text-xs"></p></div><div class="mt-5 space-y-2 border-y border-gray-200 py-4"><div class="flex items-center justify-between text-sm text-gray-500"><span>Subtotal</span><span id="cartSubtotalValue">${rupiah(cartSubtotal())}</span></div><div id="cartDiscountRow" class="${cartDiscountAmount()>0?"":"hidden"} flex items-center justify-between text-sm text-red-500"><span>Diskon</span><span id="cartDiscountValue">− ${rupiah(cartDiscountAmount())}</span></div><div class="flex items-center justify-between pt-1"><span class="font-medium">Total</span><strong id="cartTotalValue" class="text-2xl font-medium">${rupiah(cartTotal())}</strong></div></div><button id="cartCheckoutButton" data-checkout-cart ${state.cartSubmitting||Number(state.cartDiscount)>cartMaxDiscount()?"disabled":""} class="mt-5 w-full ${style.button} ${style.primary}">${state.cartSubmitting?"Menyimpan...":"Jual / Simpan transaksi"}</button>`:`<p class="mt-6 rounded-lg bg-gray-50 p-5 text-sm text-gray-500">Keranjang masih kosong.</p>`}`;updateCartPricingUI();}
    function addToCart(){const variant=state.variants.find(item=>item.id===state.saleVariantId),qty=Number($("saleQty")?.value),unitPrice=Number($("salePrice")?.value);if(!variant||!qty||qty>variant.sale_qty)return toast("Jumlah melebihi stok jual.",true);if(unitPrice<variant.minimum_price||unitPrice>variant.normal_price)return toast("Harga harus berada di rentang yang diizinkan.",true);const existing=state.cart.find(item=>item.variant_id===variant.id&&item.unit_price===unitPrice);if(existing){if(existing.qty+qty>variant.sale_qty)return toast("Jumlah di keranjang melebihi stok jual.",true);existing.qty+=qty;}else state.cart.push({...variant,variant_id:variant.id,qty,unit_price:unitPrice});renderCartButton();toast("Produk masuk ke keranjang.");renderSalesSheet("cart");}
    function buildDiscountedCartItems(){return state.cart.map(item=>({variant_id:item.variant_id,qty:item.qty,unit_price:item.unit_price}));}
    async function checkoutCart(){if(!state.cart.length||state.cartSubmitting)return;const requestedDiscount=cartDiscountAmount();if(requestedDiscount>cartMaxDiscount())return toast("Diskon terlalu besar. Total tidak boleh kurang dari harga minimum.",true);state.cartSubmitting=true;renderCartSheet();try{const result=await request("/api/transactions/batch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({payment_method:state.paymentMethod,items:buildDiscountedCartItems(),discount:requestedDiscount})});state.cart=[];state.cartDiscount=0;state.cartDiscountEnabled=false;state.cartSubmitting=false;hideModal("salesSheet");renderCartButton();toast(`${result.message} (${result.invoice_no})`);await loadAll();state.stockMode="sale";switchPage("stock");}catch(error){state.cartSubmitting=false;renderCartSheet();toast(error.message,true);}}

    function openDetail(productId){const product=groupedProducts("all").find(p=>String(p.product_id)===String(productId));if(!product)return;const colors=groupedColors(product);$("detailContent").innerHTML=`<div class="flex items-start justify-between gap-4"><div><h2 class="text-3xl font-medium">${escapeHtml(product.product_name)}</h2><p class="mt-1 text-sm text-gray-500">${escapeHtml(product.model)} · ${colors.length} warna</p></div><button data-close="detailModal" class="${style.iconButton}">×</button></div><div class="mt-5 overflow-hidden rounded-lg border border-gray-200 bg-white"><div class="aspect-[16/8] bg-gray-50">${productPhoto(product,"h-full w-full")}</div></div><div class="mt-5 space-y-3">${colors.map(c=>`<section class="rounded-lg border border-gray-200 bg-white p-4"><div class="flex items-center justify-between gap-3"><div class="flex items-center gap-3">${colorDot(c.color,"size-9",c.color_hex,c.color_stops,c.color_type)}<div><h3 class="font-medium">${escapeHtml(c.color)}</h3><p class="text-xs text-gray-400">${c.variants.length} size · ${c.variants.reduce((s,v)=>s+v.warehouse_qty,0)} unit gudang</p></div></div><button data-add-color-size="${c.color_id}" data-product-id="${product.product_id}" class="${style.button} ${style.soft} px-3 py-2 text-xs">+ Size</button></div><div class="mt-4 space-y-2">${c.variants.map(v=>`<div class="flex items-center justify-between rounded-lg bg-gray-50 px-3 py-2"><div><p class="font-medium">Size ${escapeHtml(v.size)}</p><p class="text-xs text-gray-400">Gudang ${v.warehouse_qty} · Jual ${v.sale_qty}</p><p class="mt-1 text-xs font-medium text-gray-500">HPP ${rupiah(v.hpp)} · Normal ${rupiah(v.normal_price)}</p></div><div class="flex gap-1"><button data-edit-variant="${v.id}" class="rounded-lg bg-white px-2 py-1.5 text-xs font-medium text-blue-600 ring-1 ring-gray-200">Edit</button><button data-transfer-variant="${v.id}" class="rounded-lg bg-blue-600 px-2 py-1.5 text-xs font-medium text-white">Pindah</button><button data-del     function setColorGroupType(group,type,stops=[]){const kind=String(type||"solid").toLowerCase();group.querySelector('[data-field="color_type"]').value=kind;if(kind==="gradient"){group.querySelector('[data-field="color"]').value="";group.querySelector('[data-field="color_hex"]').value=normalizeHex(stops?.[0]);group.querySelector('[data-field="color_stops"]').value=JSON.stringify(stops);group.querySelector('[data-color-picker]').innerHTML=gradientPickerHtml(stops);group.querySelector('[data-custom-slot]').innerHTML=gradientEditor(stops,"");}else{const hex=normalizeHex(stops?.[0]||group.querySelector('[data-field="color_hex"]').value);group.querySelector('[data-field="color_stops"]').value=JSON.stringify([hex]);group.querySelector('[data-color-picker"]').innerHTML=solidPickerHtml(group.querySelector('[data-field="color"]').value,hex);group.querySelector('[data-custom-slot]').innerHTML=group.querySelector('[data-custom-open]')?customColorEditor(group.querySelector('[data-field="color"]').value,hex):"";}}
    function openVariantModal(variant=null,productId="",colorName="",initialHex=""){const kind=variant?.color_type||"solid",stops=Array.isArray(variant?.color_stops)?variant.color_stops:(initialHex?[initialHex]:[]);$("variantForm").reset();$("editingVariantId").value=variant?.id||"";$("variantProduct").innerHTML=state.products.map(p=>`<option value="${p.id}" ${String(productId||variant?.product_id)===String(p.id)?"selected":""}>${escapeHtml(p.name)} · ${escapeHtml(p.model)}</option>`).join("");$("variantColorType").value=kind;$("variantColor").value=colorName||variant?.color||"";$("variantColorHex").value=variant?.color_hex||initialHex||colorHex($("variantColor").value);$("variantColorStops").value=JSON.stringify(stops);$("variantColorPicker").innerHTML=colorPickerHtml($("variantColor").value,$("variantColorHex").value,kind,stops);$("variantCustomSlot").innerHTML=kind==="gradient"?gradientEditor(stops,$("variantColor").value):($("variantColor").value&&!COLOR_PALETTE.some(([n])=>n.toLowerCase()===$("variantColor").value.toLowerCase())?customColorEditor($("variantColor").value,$("variantColorHex").value):"");$("variantSize").value=variant?.size||"";$("variantWarehouseQty").value=variant?.warehouse_qty??0;$("variantHpp").value=variant?.hpp??0;$("variantNormalPrice").value=variant?.normal_price??0;$("variantMinimumPrice").value=variant?.minimum_price??0;document.querySelectorAll("[data-variant-color-type]").forEach(b=>{const active=b.dataset.variantColorType===kind;b.className=`rounded-lg border px-3 py-2 text-sm font-medium ${active?"border-blue-600 bg-blue-600/10 text-blue-600":"border-gray-200 bg-white text-gray-500"}`;});$("variantModalTitle").textContent=variant?"Edit size":"Tambah warna / size";showModal("variantModal");}
    function sizeRow(){return `<div class="size-row grid gap-2 rounded-lg bg-white p-3 ring-1 ring-gray-200 sm:grid-cols-[.7fr_1fr_1fr_1fr_1fr_auto]"><input data-field="size" required placeholder="Size" class="${style.input.replace("mt-2 ","")}"/><input data-field="warehouse_qty" type="number" min="0" required placeholder="Stok" class="${style.input.replace("mt-2 ","")}"/><input data-field="hpp" type="number" min="0" required placeholder="HPP" class="${style.input.replace("mt-2 ","")}"/><input data-field="normal_price" type="number" min="0" required placeholder="Harga normal" class="${style.input.replace("mt-2 ","")}"/><input data-field="minimum_price" type="number" min="0" required placeholder="Harga min." class="${style.input.replace("mt-2 ","")}"/><button type="button" data-remove-size class="rounded-lg bg-red-500/10 px-3 text-sm font-medium text-red-500">×</button></div>`;}

    function collectSizeRowsValues(group){return [...group.querySelectorAll(".size-row")].map(row=>({size:row.querySelector('[data-field="size"]')?.value.trim()||"",warehouse_qty:row.querySelector('[data-field="warehouse_qty"]')?.value||"",hpp:row.querySelector('[data-field="hpp"]')?.value||"",normal_price:row.querySelector('[data-field="normal_price"]')?.value||"",minimum_price:row.querySelector('[data-field="minimum_price"]')?.value||""}));}

    function collectColors(){return [...document.querySelectorAll(".color-group")].map(g=>{const type=g.querySelector('[data-field="color_type"]').value;const stops=JSON.parse(g.querySelector('[data-field="color_stops"]').value||"[]");const color=g.querySelector('[data-field="color"]').value.trim();return {color,color_type:type,color_hex:g.querySelector('[data-field="color_hex"]').value.trim()||null,color_stops:stops,sizes:[...g.querySelectorAll(".size-row")].map(r=>({size:r.querySelector('[data-field="size"]').value.trim(),warehouse_qty:Number(r.querySelector('[data-field="warehouse_qty"]').value),hpp:Number(r.querySelector('[data-field="hpp"]').value),normal_price:Number(r.querySelector('[data-field="normal_price"]').value),minimum_price:Number(r.querySelector('[data-field="minimum_price"]').value)}))};});}

    // 7. LOAD DATA & INTERACTIONS
    async function loadAll(){const [dashboard,products,variants,transactions]=await Promise.all([request("/api/dashboard"),request("/api/products"),request("/api/variants"),request("/api/transactions?limit=5000")]);state.dashboard=dashboard&&typeof dashboard==="object"?dashboard:{};state.products=Array.isArray(products)?products.map(p=>({...p,id:String(p.id??p._id)})):[];state.variants=Array.isArray(variants)?variants.map(v=>({...v,id:String(v.id??v._id),product_id:String(v.product_id),color_id:String(v.color_id)})):[];state.transactions=Array.isArray(transactions)?transactions:[];renderNavigation();renderDashboard();renderStock();renderTransaction();renderHistory();}
    function switchPage(page){state.page=page;document.querySelectorAll(".page").forEach(section=>section.classList.toggle("hidden",section.id!==`${page}Page`));$("pageTitle").textContent=({dashboard:"Dashboard",stock:"Stok",transaction:"Transaksi",history:"History Transaksi"})[page]||"Dashboard";document.querySelectorAll(".header-action").forEach(el=>el.classList.toggle("hidden",el.dataset.headerFor!==page));renderCartButton();renderNavigation();window.scrollTo({top:0,behavior:"smooth"});}

    document.addEventListener("click",async event=>{
      const page=event.target.closest("[data-page]")?.dataset.page;if(page)switchPage(page);
      const go=event.target.closest("[data-go]")?.dataset.go;if(go)switchPage(go);
      const close=event.target.closest("[data-close]")?.dataset.close;if(close)hideModal(close);
      const mode=event.target.closest("[data-stock-mode]")?.dataset.stockMode;if(mode){state.stockMode=mode;renderStock();}
      const product=event.target.closest("[data-open-product]")?.dataset.openProduct;if(product)openDetail(product);
      const sellProduct=event.target.closest("[data-sell-product]")?.dataset.sellProduct;if(sellProduct)openSalesSheet(sellProduct);
      const saleColor=event.target.closest("[data-sale-color]")?.dataset.saleColor;if(saleColor){state.saleColorId=String(saleColor);state.saleVariantId=null;renderSalesSheet();}
      const saleVariant=event.target.closest("[data-sale-variant]")?.dataset.saleVariant;if(saleVariant){state.saleVariantId=String(saleVariant);renderSalesSheet();}
      if(event.target.closest("[data-add-cart]"))addToCart();
      if(event.target.closest("[data-open-cart]"))renderSalesSheet("cart");
      const removeCart=event.target.closest("[data-remove-cart]")?.dataset.removeCart;if(removeCart){state.cart=state.cart.filter(item=>String(item.variant_id)!==String(removeCart));if(!state.cart.length){state.cartDiscount=0;state.cartDiscountEnabled=false;}renderCartButton();renderSalesSheet("cart");}
      const paymentMethod=event.target.closest("[data-payment-method]")?.dataset.paymentMethod;if(paymentMethod){state.paymentMethod=paymentMethod;renderSalesSheet("cart");}      if(event.target.closest("#cartDiscountToggle")){state.cartDiscountEnabled=event.target.closest("#cartDiscountToggle").checked;if(!state.cartDiscountEnabled)state.cartDiscount=0;renderSalesSheet("cart");}
      const transactionPayment=event.target.closest("[data-transaction-payment]")?.dataset.transactionPayment;if(transactionPayment){state.paymentMethod=transactionPayment;syncTransactionPaymentUI();}
      if(event.target.closest("[data-checkout-cart]"))checkoutCart();
      const historyDate=event.target.closest("[data-history-date]")?.dataset.historyDate;if(historyDate){state.historyDate=historyDate;renderHistory();}
      if(event.target.closest("#customDateButton")){const input=$("customHistoryDate");input.showPicker?input.showPicker():input.click();}
      const transactionProduct=event.target.closest("[data-transaction-product]")?.dataset.transactionProduct;if(transactionProduct){state.transactionProductId=String(transactionProduct);state.transactionColorId=null;state.transactionVariantId=null;$("transactionQty").value="";$("transactionPrice").value="";renderTransaction();}
      const transactionColor=event.target.closest("[data-transaction-color]")?.dataset.transactionColor;if(transactionColor){state.transactionColorId=String(transactionColor);state.transactionVariantId=null;$("transactionQty").value="";$("transactionPrice").value="";renderTransaction();}
      const transactionVariant=event.target.closest("[data-transaction-variant]")?.dataset.transactionVariant;if(transactionVariant){state.transactionVariantId=String(transactionVariant);$("transactionQty").value="";$("transactionPrice").value="";renderTransaction();}
      const edit=event.target.closest("[data-edit-variant]")?.dataset.editVariant;if(edit){hideModal("detailModal");openVariantModal(state.variants.find(v=>String(v.id)===String(edit)));}
      const add=event.target.closest("[data-add-to-product]")?.dataset.addToProduct;if(add){hideModal("detailModal");openVariantModal(null,String(add));}
      const addColor=event.target.closest("[data-add-color-size]");if(addColor){const v=state.variants.find(x=>String(x.product_id)===String(addColor.dataset.productId)&&String(x.color_id)===String(addColor.dataset.addColorSize));hideModal("detailModal");openVariantModal(null,String(addColor.dataset.productId),v?.color||"",v?.color_hex||"");}

    });

    function openTransferModal(variantId){const variant=state.variants.find(v=>String(v.id)===String(variantId));if(!variant)return toast("Varian tidak ditemukan",true);const productVariants=state.variants.filter(v=>String(v.product_id)===String(variant.product_id)&&v.warehouse_qty>0);$("transferVariant").innerHTML=productVariants.map(v=>`<option value="${v.id}" ${String(v.id)===String(variantId)?"selected":""}>${escapeHtml(v.color)} - Size ${escapeHtml(v.size)} (${v.warehouse_qty} unit)</option>`).join("");$("transferQty").value="";showModal("transferModal");}

    $("productForm").addEventListener("submit",async event=>{event.preventDefault();if(state.productSubmitting)return;const colors=collectColors(),fileInput=$("productImage"),cameraInput=$("productCamera"),image=fileInput.files[0]||cameraInput.files[0];if(!image)return toast("Gambar utama produk wajib dipilih.",true);if(colors.some(c=>c.color_type==="gradient"?(c.color_stops.length<2||!c.color):!c.color))return toast("Nama warna wajib diisi untuk semua seri.",true);if(colors.some(c=>c.sizes.some(s=>s.minimum_price>s.normal_price)))return toast("Harga minimum tidak boleh melebihi harga normal.",true);state.productSubmitting=true;const submitButton=$("productForm").querySelector('button[type="submit"]');if(submitButton){submitButton.disabled=true;submitButton.textContent="Menyimpan...";}try{const result=await request("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("productName").value.trim(),model:$("productModel").value.trim(),colors})});const fd=new FormData();fd.append("image",image);try{await request(`/api/products/${result.id}/image`,{method:"POST",body:fd});}catch(imageError){try{await request(`/api/products/${result.id}`,{method:"DELETE"});}catch(_cleanupError){}throw imageError;}hideModal("productModal");toast(result.message);await loadAll();state.stockMode="warehouse";switchPage("stock");}catch(error){toast(error.message,true);}finally{state.productSubmitting=false;if(submitButton){submitButton.disabled=false;submitButton.textContent="Simpan produk";}}});

    const AUTH_KEY = "stokku_auth_token";

    const clearAuthToken = () => localStorage.removeItem(AUTH_KEY);

    function showApp(){$("loginScreen").classList.add("hidden");$("loginScreen").classList.remove("flex");$("app").classList.remove("hidden");const loader=$("initialLoader");loadAll().catch(error=>toast(error.message,true)).finally(()=>{if(loader)loader.classList.add("hidden");});}
    function showLogin(message){const loader=$("initialLoader");if(loader)loader.classList.add("hidden");$("app").classList.add("hidden");$("loginScreen").classList.remove("hidden");$("loginScreen").classList.add("flex");if(message){const err=$("loginError");err.textContent=message;err.classList.remove("hidden");}$("loginUsername")?.focus();}

    $("loginForm").addEventListener("submit", async event=>{event.preventDefault();const submitButton=$("loginSubmit"),errorEl=$("loginError");errorEl.classList.add("hidden");submitButton.disabled=true;submitButton.textContent="Memeriksa...";try{const result=await request("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("loginUsername").value.trim(),password:$("loginPassword").value})});setAuthToken(result.token);$("loginForm").reset();showApp();}catch(error){errorEl.textContent=error.message;errorEl.classList.remove("hidden");}finally{submitButton.disabled=false;submitButton.textContent="Masuk";}});
